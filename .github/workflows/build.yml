# انسخ هذا الملف كاملًا إلى المستودع باسم:  .github/workflows/build.yml
# (من GitHub: Add file ← Create new file ← اكتب الاسم أعلاه ← الصق المحتوى ← Commit)

name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web assets (web/index.html -> app assets)
        run: python3 tools/make_assets.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app-debug.apk \
            --title "Daftar build ${{ github.run_number }}" \
            --notes "APK build number ${{ github.run_number }}. Download app-debug.apk and install it over the old version." \
            --latest
